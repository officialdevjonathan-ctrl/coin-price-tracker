<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Crypto Market Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12;
    --surface:#10141B;
    --surface-2:#171D26;
    --surface-3:#1E2530;
    --border:#232B36;
    --border-soft:#1A212B;
    --text-primary:#E7EAEE;
    --text-secondary:#8B93A1;
    --text-muted:#5C6470;
    --accent:#5EEAD4;
    --accent-dim:#1F4A45;
    --positive:#34D399;
    --positive-dim:#12291F;
    --negative:#F87171;
    --negative-dim:#2E1616;
    --radius:10px;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', -apple-system, sans-serif;
    --display:'Space Grotesk', var(--sans);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text-primary);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{background:var(--accent-dim); color:var(--accent);}

  .app{
    max-width:1900px;
    margin:0 auto;
    padding:0 20px 60px;
  }

  /* ---------- Header ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(10,13,18,0.88);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
    padding:18px 0 16px;
    margin-bottom:22px;
  }

  .topbar-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand-mark{
    width:30px;height:30px;
    border-radius:8px;
    background:linear-gradient(155deg, var(--accent), #2DD4BF);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);
    font-weight:700;
    color:#062420;
    font-size:15px;
    flex-shrink:0;
  }

  .brand-text h1{
    font-family:var(--display);
    font-size:17px;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }

  .brand-text p{
    margin:0;
    font-size:11.5px;
    color:var(--text-muted);
    font-family:var(--mono);
  }

  .status-cluster{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }

  .live-pulse{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-secondary);
    white-space:nowrap;
  }

  .dot{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--positive);
    position:relative;
    flex-shrink:0;
  }
  .dot::after{
    content:'';
    position:absolute;
    inset:-5px;
    border-radius:50%;
    border:1px solid var(--positive);
    opacity:0;
    animation:pulse-ring 2.2s ease-out infinite;
  }
  .dot.fetching{background:var(--accent);}
  .dot.fetching::after{border-color:var(--accent);}
  @keyframes pulse-ring{
    0%{opacity:0.7; transform:scale(0.4);}
    100%{opacity:0; transform:scale(1.6);}
  }

  .search-wrap{
    position:relative;
    width:230px;
  }
  .search-wrap input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 12px 9px 34px;
    color:var(--text-primary);
    font-size:13.5px;
    font-family:var(--sans);
    outline:none;
    transition:border-color .15s;
  }
  .search-wrap input::placeholder{color:var(--text-muted);}
  .search-wrap input:focus{border-color:var(--accent);}
  .search-icon{
    position:absolute;
    left:11px;top:50%;
    transform:translateY(-50%);
    width:14px;height:14px;
    color:var(--text-muted);
    pointer-events:none;
  }

  /* ---------- Table ---------- */
  .table-wrap{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-top:none;
    border-radius:0 0 var(--radius) var(--radius);
    overflow-x:auto;
  }
  .table-header-wrap{
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    border-bottom:none;
    border-radius:var(--radius) var(--radius) 0 0;
    overflow-x:hidden;
    position:sticky;
    top:var(--topbar-height, 74px);
    z-index:15;
  }
  .table-wrap::-webkit-scrollbar{
    width:8px;
    height:8px;
  }
  .table-wrap::-webkit-scrollbar-track{
    background:var(--surface);
  }
  .table-wrap::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:4px;
  }
  .table-wrap::-webkit-scrollbar-thumb:hover{
    background:var(--text-muted);
  }
  .table-wrap{
    scrollbar-width:thin;
    scrollbar-color:var(--border) var(--surface);
  }

  .coin-detail-flex{
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  .coin-mini-list{
    width:240px;
    flex-shrink:0;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    max-height:80vh;
    overflow-y:auto;
  }
  .coin-detail-main{
    flex:1;
    min-width:0;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:20px;
  }
  .coin-detail-sidebar{
    width:300px;
    flex-shrink:0;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:20px;
  }

  @media (min-width: 1300px){
    .coin-detail-main{
      flex:10 1 0;
    }
    .coin-detail-sidebar{
      flex:4 1 0;
      width:auto;
    }
  }

  #coinMiniList::-webkit-scrollbar{
    width:8px;
  }
  #coinMiniList::-webkit-scrollbar-track{
    background:var(--surface);
  }
  #coinMiniList::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:4px;
  }
  #coinMiniList::-webkit-scrollbar-thumb:hover{
    background:var(--text-muted);
  }
  #coinMiniList{
    scrollbar-width:thin;
    scrollbar-color:var(--border) var(--surface);
  }

  table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
    font-family:var(--sans);
  }

  thead th{
    text-align:right;    
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-muted);
    font-weight:600;
    padding:13px 16px;
    border-bottom:1px solid var(--border);
    background:var(--surface-2);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    transition:color .15s;
  }
  thead th:hover{color:var(--text-secondary);}
  thead th.active{color:var(--accent);}
  thead th.col-rank,thead th.col-name{
    text-align:left;
    position:sticky;
    z-index:16;
  }
  thead th.col-rank{ left:0; width:56px; min-width:56px; max-width:56px; }
  thead th.col-name{ left:56px; width:190px; min-width:190px; max-width:190px; }

  .th-inner{
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  thead th.col-rank .th-inner,thead th.col-name .th-inner{flex-direction:row;}
  thead th:not(.col-rank):not(.col-name) .th-inner{flex-direction:row-reverse;}

  .sort-arrow{
    font-size:9px;
    opacity:0;
    transition:opacity .15s;
  }
  thead th.active .sort-arrow{opacity:1;}

  tbody tr{
    border-bottom:1px solid var(--border-soft);
    transition:background .12s;
  }
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr:hover td.col-rank, tbody tr:hover td.col-name{
    background:var(--surface-2);
  }
  

  td{
    padding:12px 16px;
    font-size:13.5px;
    text-align:right;
    white-space:nowrap;
    font-family:var(--mono);
  }

  td.col-rank{
    text-align:left;
    color:var(--text-muted);
    font-size:12.5px;
    width:56px;
    min-width:56px;
    max-width:56px;
    position:sticky;
    left:0;
    z-index:5;
    background:var(--surface);
  }

  td.col-name{
    text-align:left;
    font-family:var(--sans);
    width:190px;
    min-width:190px;
    max-width:190px;
    position:sticky;
    left:56px;
    z-index:5;
    background:var(--surface);
  }

  .coin-cell{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .coin-cell img{
    width:24px;height:24px;
    border-radius:50%;
    flex-shrink:0;
    background:var(--surface-3);
  }
  .coin-name{
    font-weight:500;
    font-size:13.5px;
    color:var(--text-primary);
  }
  .coin-symbol{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--text-muted);
    text-transform:uppercase;
  }

  .change-pill{
    display:inline-flex;
    align-items:center;
    gap:3px;
    padding:3px 8px;
    border-radius:6px;
    font-size:12.5px;
    font-weight:500;
    font-family:var(--mono);
  }
  .change-pill.pos{background:var(--positive-dim); color:var(--positive);}
  .change-pill.neg{background:var(--negative-dim); color:var(--negative);}

  .flash-up{animation:flashUp 0.9s ease-out;}
  .flash-down{animation:flashDown 0.9s ease-out;}
  @keyframes flashUp{
    0%{background:rgba(52,211,153,0.16);}
    100%{background:transparent;}
  }
  @keyframes flashDown{
    0%{background:rgba(248,113,113,0.16);}
    100%{background:transparent;}
  }

  .empty-state{
    padding:60px 20px;
    text-align:center;
    color:var(--text-muted);
    font-size:13.5px;
  }

  .skeleton-row td{padding:14px 16px;}
  thead th.col-sparkline, td.col-sparkline{
    text-align:right;
    padding-left:8px;
    padding-right:1px;
  }
  thead th.col-1h, td.col-1h,
  thead th.col-change, td.col-change,
  thead th.col-7d, td.col-7d{
    padding-left:8px;
    padding-right:8px;
  }
  thead th.col-1h, td.col-1h{
    padding-left:24px;
  }
  thead th.col-7d, td.col-7d{
    padding-right:24px;
  }
  .skeleton-bar{
    height:14px;
    border-radius:4px;
    background:linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
  }
  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  .error-banner{
    background:var(--negative-dim);
    border:1px solid rgba(248,113,113,0.25);
    color:var(--negative);
    padding:12px 16px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .error-banner button{
    background:transparent;
    border:1px solid rgba(248,113,113,0.4);
    color:var(--negative);
    border-radius:6px;
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
    font-family:var(--sans);
    flex-shrink:0;
  }

  /* ---------- Mobile cards ---------- */
  .card-list{display:none;}

  @media (max-width: 760px){
    .app{padding:0 14px 40px;}
    thead th, td{
      padding:10px 12px;
      font-size:12.5px;
    }
    .search-wrap{ width:120px; }
    #pageSizeSelect{ display:none; }
    .coin-detail-flex{
      flex-direction:column;
    }
    .coin-mini-list{
      width:100%;
      max-height:190px;
    }
    .coin-detail-main, .coin-detail-sidebar{
      width:100%;
    }
  }
  .pagination-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin:18px 0;
    flex-wrap:wrap;
  }
  .page-btn{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-secondary);
    border-radius:6px;
    padding:6px 11px;
    cursor:pointer;
    font-family:var(--mono);
    font-size:12.5px;
    transition:background .12s, color .12s;
  }
  .page-btn:hover{background:var(--surface-3); color:var(--text-primary);}
  .page-btn:disabled{opacity:0.35; cursor:default;}
  .page-btn.active{background:var(--accent-dim); color:var(--accent); border-color:var(--accent);}
  
  .footer-note{
    text-align:center;
    color:var(--text-muted);
    font-size:11.5px;
    font-family:var(--mono);
    margin-top:22px;
  }

  a{color:inherit;}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">L</div>
        <div class="brand-text">
          <h1>Ledger</h1>
          <p>Live market data</p>
        </div>
      </div>
      <div class="status-cluster">
        <div class="live-pulse">
          <div class="dot" id="liveDot"></div>
          <span id="lastUpdated">Loading…</span>
        </div>
        <select id="refreshSelect" style="background:var(--surface-2); border:1px solid var(--border); border-radius:8px; color:var(--text-primary); font-family:var(--mono); font-size:12px; padding:8px 10px;">
          <option value="5000">5s</option>
          <option value="10000">10s</option>
          <option value="15000">15s</option>
          <option value="30000">30s</option>
          <option value="45000" selected>45s</option>
        </select>
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search name or symbol…" autocomplete="off">
        </div>        
        <select id="pageSizeSelect" style="background:var(--surface-2); border:1px solid var(--border); border-radius:8px; color:var(--text-primary); font-family:var(--mono); font-size:12px; padding:8px 10px;">
          <option value="50">50 / page</option>
          <option value="100" selected>100 / page</option>
          <option value="200">200 / page</option>
          <option value="500">500 / page</option>
        </select>
      </div>
    </div>
  </div>

  <div id="errorBanner" style="display:none;"></div>

  <div class="pagination-bar" id="paginationTop"></div>

  <div class="table-header-wrap" id="tableHeaderWrap">
    <table id="headerTable">
      <colgroup>
        <col style="width:56px"><col style="width:190px"><col style="width:110px">
        <col style="width:130px"><col style="width:90px"><col style="width:90px">
        <col style="width:90px"><col style="width:98px"><col style="width:130px">
      </colgroup>
      <thead>
        <tr>
          <th class="col-rank" data-sort="market_cap_rank"><span class="th-inner">#</span></th>
          <th class="col-name" data-sort="name"><span class="th-inner">Coin</span></th>
          <th class="col-price" data-sort="current_price"><span class="th-inner">Price<span class="sort-arrow">▼</span></span></th>
          <th class="col-mcap active" data-sort="market_cap"><span class="th-inner">Market cap<span class="sort-arrow">▼</span></span></th>
          <th class="col-1h" data-sort="price_change_percentage_1h_in_currency"><span class="th-inner">1h<span class="sort-arrow">▼</span></span></th>
          <th class="col-change" data-sort="price_change_percentage_24h_in_currency"><span class="th-inner">24h<span class="sort-arrow">▼</span></span></th>
          <th class="col-7d" data-sort="price_change_percentage_7d_in_currency"><span class="th-inner">7d<span class="sort-arrow">▼</span></span></th>
          <th class="col-sparkline">7d chart</th>
          <th class="col-volume" data-sort="total_volume"><span class="th-inner">24h volume<span class="sort-arrow">▼</span></span></th>
        </tr>
      </thead>
    </table>
  </div>
  <div class="table-wrap" id="tableWrap">
    <table id="bodyTable">
      <colgroup>
        <col style="width:56px"><col style="width:190px"><col style="width:110px">
        <col style="width:130px"><col style="width:90px"><col style="width:90px">
        <col style="width:90px"><col style="width:98px"><col style="width:130px">
      </colgroup>
      <tbody id="tableBody">
        <!-- rows injected here -->
      </tbody>
    </table>
  </div>
  <div class="pagination-bar" id="paginationBottom"></div>
  <div id="coinDetailView" style="display:none;">
    <button id="coinDetailBackBtn" style="background:var(--surface-2); border:1px solid var(--border); color:var(--text-primary); border-radius:8px; padding:8px 14px; font-family:var(--sans); font-size:13px; cursor:pointer; margin-bottom:16px;">← Back to all coins</button>

    <div class="coin-detail-flex">

      <div id="coinMiniList" class="coin-mini-list">
        <!-- mini coin list injected here -->
      </div>

      <div id="coinDetailMain" class="coin-detail-main">
        <!-- chart + exchanges injected here -->
      </div>

      <div id="coinDetailSidebar" class="coin-detail-sidebar">
        <!-- stats injected here -->
      </div>

    </div>
  </div>
  <div class="footer-note">Coin Price Tracker by joebuildz · refreshes automatically every 45s</div>
</div>

<script>
(function(){
  const PAGES_TO_FETCH = 2;
  const COINS_PER_FETCH = 250;
  const API_URL_BASE = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&sparkline=true&price_change_percentage=1h,24h,7d&per_page=" + COINS_PER_FETCH;
    
  let REFRESH_MS = 45000;
  let coins = [];
  let prevPrices = {};
  let sortKey = "market_cap";
  let currentPage = 1;
  let pageSize = 100;
  let sortDir = "desc";
  let searchTerm = "";
  let lastFetchTime = null;
  let fetchTimer = null;
  let countdownTimer = null;

  const tableBody = document.getElementById('tableBody');
  const searchInput = document.getElementById('searchInput');
  const lastUpdatedEl = document.getElementById('lastUpdated');
  const liveDot = document.getElementById('liveDot');
  const errorBanner = document.getElementById('errorBanner');
  const headers = document.querySelectorAll('thead th[data-sort]');

  function formatCurrency(num, opts){
    opts = opts || {};
    if(num === null || num === undefined) return '—';
    const digits = num < 1 ? (opts.small ? 6 : 4) : 2;
    return '$' + num.toLocaleString('en-US', {
      minimumFractionDigits: opts.compact ? 0 : Math.min(digits,2),
      maximumFractionDigits: opts.compact ? 0 : digits
    });
  }

  function formatCompact(num){
    if(num === null || num === undefined) return '—';
    return '$' + Intl.NumberFormat('en-US', { notation:'compact', maximumFractionDigits:2 }).format(num);
  }

  function formatPct(num){
    if(num === null || num === undefined) return '—';
    const sign = num > 0 ? '+' : '';
    return sign + num.toFixed(2) + '%';
  }

  function renderPaginationControls(totalPages){
    const windowSize = 10;
    let start = Math.max(1, currentPage - Math.floor(windowSize / 2));
    let end = Math.min(totalPages, start + windowSize - 1);
    start = Math.max(1, end - windowSize + 1);

    let numbersHtml = '';
    for(let p = start; p <= end; p++){
      numbersHtml += `<button class="page-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`;
    }

    return `
      <button class="page-btn" data-action="prev" ${currentPage <= 1 ? 'disabled' : ''}>Prev</button>
      ${numbersHtml}
      <button class="page-btn" data-action="next" ${currentPage >= totalPages ? 'disabled' : ''}>Next</button>
    `;
  }

  function buildSparkline(prices, isPositive){
    if(!prices || prices.length < 2) return '';
    const w = 74, h = 28;
    const min = Math.min(...prices);
    const max = Math.max(...prices);
    const range = max - min || 1;
    const points = prices.map((p, i) => {
      const x = (i / (prices.length - 1)) * w;
      const y = h - ((p - min) / range) * h;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const color = isPositive ? 'var(--positive)' : 'var(--negative)';
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:inine-block;">
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
  }

  function renderSkeleton(){
    let rows = '';
    for(let i=0;i<12;i++){
      rows += `<tr class="skeleton-row">
        <td colspan="6"><div class="skeleton-bar" style="width:${70+Math.random()*20}%"></div></td>
      </tr>`;
    }
    tableBody.innerHTML = rows;
  }

  function getSorted(list){
    const sorted = [...list].sort((a,b)=>{
      let av = a[sortKey], bv = b[sortKey];
      if(sortKey === 'name'){
        av = (av||'').toLowerCase(); bv = (bv||'').toLowerCase();
        return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      }
      av = av === null || av === undefined ? -Infinity : av;
      bv = bv === null || bv === undefined ? -Infinity : bv;
      return sortDir === 'asc' ? av - bv : bv - av;
    });
    return sorted;
  }

  function getFiltered(list){
    if(!searchTerm) return list;
    const q = searchTerm.toLowerCase();
    return list.filter(c =>
      c.name.toLowerCase().includes(q) || c.symbol.toLowerCase().includes(q)
    );
  }

  function render(){
    const filtered = getFiltered(coins);
    const sorted = getSorted(filtered);
    const totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));
    if(currentPage > totalPages) currentPage = totalPages;
    const startIdx = (currentPage - 1) * pageSize;
    const pageItems = sorted.slice(startIdx, startIdx + pageSize);

    if(sorted.length === 0){
      tableBody.innerHTML = `<tr><td colspan="6"><div class="empty-state">No coins match "${escapeHtml(searchTerm)}"</div></td></tr>`;
      return;
    }

    let html = '';
    pageItems.forEach((c, idx) => {
      const changeClass = c.price_change_percentage_24h_in_currency >= 0 ? 'pos' : 'neg';
      const changeArrow = c.price_change_percentage_24h_in_currency >= 0 ? '▲' : '▼';
      const prevPrice = prevPrices[c.id];
      let flashClass = '';
      if(prevPrice !== undefined && prevPrice !== c.current_price){
        flashClass = c.current_price > prevPrice ? 'flash-up' : 'flash-down';
      }

      html += `<tr>
        <td class="col-rank">${startIdx + idx + 1}</td>
        <td class="col-name">
          <div class="coin-cell">
            <img src="${c.image}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
            <div>
              <div class="coin-name">${escapeHtml(c.name)}</div>
              <div class="coin-symbol">${escapeHtml(c.symbol)}</div>
            </div>
          </div>
        </td>
        <td class="col-price ${flashClass}">${formatCurrency(c.current_price)}</td>
        <td class="col-mcap">${formatCompact(c.market_cap)}</td>
        <td class="col-1h">
          <span class="change-pill ${c.price_change_percentage_1h_in_currency >= 0 ? 'pos' : 'neg'}">${c.price_change_percentage_1h_in_currency >= 0 ? '▲' : '▼'} ${Math.abs(c.price_change_percentage_1h_in_currency ?? 0).toFixed(2)}%</span>
        </td>
        <td class="col-change">
          <span class="change-pill ${changeClass}">${changeArrow} ${Math.abs(c.price_change_percentage_24h_in_currency ?? 0).toFixed(2)}%</span>
        </td>
        <td class="col-7d">
          <span class="change-pill ${c.price_change_percentage_7d_in_currency >= 0 ? 'pos' : 'neg'}">${c.price_change_percentage_7d_in_currency >= 0 ? '▲' : '▼'} ${Math.abs(c.price_change_percentage_7d_in_currency ?? 0).toFixed(2)}%</span>
        </td>
        <td class="col-sparkline">${buildSparkline(c.sparkline_in_7d?.price, c.price_change_percentage_7d_in_currency >= 0)}</td>
        <td class="col-volume">${formatCompact(c.total_volume)}</td>
        <td class="mobile-only" style="display:none"></td>
      </tr>`;
    });

    tableBody.innerHTML = html;

    tableBody.querySelectorAll('tr').forEach((row, i) => {
      const coin = pageItems[i];
      if(!coin) return;
      row.style.cursor = 'pointer';
      row.addEventListener('click', () => showCoinDetail(coin.id));
    });
    
    prevPrices = {};
    coins.forEach(c => prevPrices[c.id] = c.current_price);

    const paginationHtml = renderPaginationControls(totalPages);
    document.getElementById('paginationTop').innerHTML = paginationHtml;
    document.getElementById('paginationBottom').innerHTML = paginationHtml;

    updateHeaderState();
  }

    function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updateHeaderState(){
    headers.forEach(th => {
      const key = th.getAttribute('data-sort');
      th.classList.toggle('active', key === sortKey);
      const arrow = th.querySelector('.sort-arrow');
      if(arrow){
        arrow.textContent = sortDir === 'asc' ? '▲' : '▼';
      }
    });
  }

  async function fetchWithRetry(url, retries = 2, delayMs = 1000){
    for(let attempt = 0; attempt <= retries; attempt++){
      try{
        const res = await fetch(url);
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      }catch(err){
        const isLastAttempt = attempt === retries;
        if(isLastAttempt) throw err;
        await new Promise(resolve => setTimeout(resolve, delayMs * (attempt + 1)));
      }
    }
  }

  let activeCoinId = null;

  async function showCoinDetail(coinId){
    activeCoinId = coinId;
    document.getElementById('tableHeaderWrap').style.display = 'none';
    document.getElementById('tableWrap').style.display = 'none';
    document.getElementById('paginationTop').style.display = 'none';
    document.getElementById('paginationBottom').style.display = 'none';
    document.getElementById('coinDetailView').style.display = 'block';
    renderCoinMiniList();
    await loadCoinDetailData(coinId);
  }

  function renderCoinDetailSidebarSection1(){
    if(!coinDetailData) return;
    const d = coinDetailData;
    const price = d.market_data?.current_price?.usd;
    const change24h = d.market_data?.price_change_percentage_24h;
    const changeClass = change24h >= 0 ? 'pos' : 'neg';
    const changeArrow = change24h >= 0 ? '▲' : '▼';

    document.getElementById('coinDetailSidebar').innerHTML = `
      <div style="margin-bottom:20px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
          <img src="${d.image?.small}" alt="" style="width:28px; height:28px; border-radius:50%;">
          <span style="font-family:var(--display); font-size:16px; font-weight:600;">${escapeHtml(d.name)}</span>
          <span style="font-family:var(--mono); font-size:11px; color:var(--text-muted); text-transform:uppercase;">${escapeHtml(d.symbol)}</span>
        </div>
        <div style="display:flex; align-items:baseline; gap:10px;">
          <span style="font-family:var(--mono); font-size:26px; font-weight:600;">${formatCurrency(price)}</span>
          <span class="change-pill ${changeClass}">${changeArrow} ${Math.abs(change24h ?? 0).toFixed(2)}%</span>
        </div>
      </div>
    `;
  }

  let coinDetailData = null;

  async function loadCoinDetailData(coinId){
    document.getElementById('coinDetailSidebar').innerHTML = '<div style="color:var(--text-muted); font-size:13px;">Loading coin details…</div>';
    try{
      const res = await fetch(`https://api.coingecko.com/api/v3/coins/${coinId}?localization=false&tickers=false&market_data=true&community_data=true&developer_data=true&sparkline=false`);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      coinDetailData = data;
      console.log('Coin detail data:', data);
      renderCoinDetailSidebarSection1();
    }catch(err){
      document.getElementById('coinDetailSidebar').innerHTML = `<div style="color:var(--negative); font-size:13px;">Couldn't load coin details. ${escapeHtml(err.message || '')}</div>`;
    }
  }

  function hideCoinDetail(){
    activeCoinId = null;
    document.getElementById('coinDetailView').style.display = 'none';
    document.getElementById('tableHeaderWrap').style.display = '';
    document.getElementById('tableWrap').style.display = '';
    document.getElementById('paginationTop').style.display = '';
    document.getElementById('paginationBottom').style.display = '';
  }

  function renderCoinMiniList(){
    const container = document.getElementById('coinMiniList');
    container.innerHTML = coins.map(c => `
      <div class="mini-coin-row" data-coin-id="${c.id}" style="display:flex; align-items:center; gap:8px; padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--border-soft); ${c.id === activeCoinId ? 'background:var(--surface-2);' : ''}">
        <span style="width:20px; color:var(--text-muted); font-size:11px; font-family:var(--mono); flex-shrink:0;">${c.market_cap_rank ?? '—'}</span>
        <img src="${c.image}" alt="" style="width:20px; height:20px; border-radius:50%; flex-shrink:0;">
        <span style="font-size:12.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(c.name)}</span>
        <span style="margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--text-secondary); flex-shrink:0;">${formatCurrency(c.current_price)}</span>
      </div>
    `).join('');

    container.querySelectorAll('.mini-coin-row').forEach(row => {
      row.addEventListener('click', () => showCoinDetail(row.dataset.coinId));
    });
  }

  document.getElementById('coinDetailBackBtn').addEventListener('click', hideCoinDetail);

  async function fetchData(showSkeleton){
    if(showSkeleton) renderSkeleton();
    liveDot.classList.add('fetching');
    try{
      const pages = [];
      for(let p = 1; p <= PAGES_TO_FETCH; p++){
        const pageData = await fetchWithRetry(`${API_URL_BASE}&page=${p}`);
        pages.push(pageData);
        if(p < PAGES_TO_FETCH){
          await new Promise(resolve => setTimeout(resolve, 400));
        }
      }
      coins = pages.flat();
      lastFetchTime = Date.now();
      errorBanner.style.display = 'none';
      render();
    }catch(err){
      errorBanner.style.display = 'flex';
      errorBanner.className = 'error-banner';
      errorBanner.innerHTML = `<span>Couldn't refresh market data. ${escapeHtml(err.message || '')}</span>`;
      const retryBtn = document.createElement('button');
      retryBtn.textContent = 'Retry';
      retryBtn.onclick = () => fetchData(coins.length === 0);
      errorBanner.appendChild(retryBtn);
    }finally{
      liveDot.classList.remove('fetching');
    }
  }

  function updateCountdown(){
    if(!lastFetchTime){ lastUpdatedEl.textContent = 'Loading…'; return; }
    const secs = Math.floor((Date.now() - lastFetchTime) / 1000);
    lastUpdatedEl.textContent = secs <= 1 ? 'Updated just now' : `Updated ${secs}s ago`;
  }

  headers.forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-sort');
      if(sortKey === key){
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      }else{
        sortKey = key;
        sortDir = key === 'name' ? 'asc' : 'desc';
      }
      render();
    });
  });

  let searchDebounce;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => {
      searchTerm = e.target.value.trim();
      searchTerm = e.target.value.trim();
      currentPage = 1;
      render();
    }, 150);
  });

  function handlePaginationClick(e){
    const btn = e.target.closest('.page-btn');
    if(!btn || btn.disabled) return;
    if(btn.dataset.action === 'prev'){ currentPage--; }
    else if(btn.dataset.action === 'next'){ currentPage++; }
    else if(btn.dataset.page){ currentPage = parseInt(btn.dataset.page, 10); }
    render();
  }
  document.getElementById('paginationTop').addEventListener('click', handlePaginationClick);
  document.getElementById('paginationBottom').addEventListener('click', handlePaginationClick);
  
  // Sync mobile card visibility with viewport via CSS already; but we need
  // the injected .mobile-extra to only show on mobile — controlled by CSS.
  
  function startAutoRefresh(){
    if(fetchTimer) clearInterval(fetchTimer);
    fetchTimer = setInterval(() => fetchData(false), REFRESH_MS);
  }

  document.getElementById('refreshSelect').addEventListener('change', (e) => {
    REFRESH_MS = parseInt(e.target.value, 10);
    startAutoRefresh();
  });
  document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
    pageSize = parseInt(e.target.value, 10);
    currentPage = 1;
    render();
  });

  function updateTopbarHeightVar(){    
    const topbar = document.querySelector('.topbar');
    if(topbar){
      document.documentElement.style.setProperty('--topbar-height', topbar.offsetHeight + 'px');
    }
    
  }

  const tableWrap = document.getElementById('tableWrap');
  const tableHeaderWrap = document.getElementById('tableHeaderWrap');
  if(tableWrap && tableHeaderWrap){
    tableWrap.addEventListener('scroll', () => {
      tableHeaderWrap.scrollLeft = tableWrap.scrollLeft;
    });
  }

  window.addEventListener('resize', updateTopbarHeightVar);
  updateTopbarHeightVar();

  fetchData(true);
  startAutoRefresh();
  countdownTimer = setInterval(updateCountdown, 1000);
})();
</script>

</body>
</html>
